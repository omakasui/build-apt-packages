# Source of truth for package versions. Pushing a change here triggers a build.
# depends_on:      list of sibling packages required at build time (empty [] if none).
# auto_update:     set to false to exclude a package from the daily version check.
# stable_release:  set to true to publish directly to stable (skips dev) on every version bump.
# frozen_suites:   list of suites to exclude from updates (e.g. if a package version is incompatible with an older distro release).

