name: netpala
type: build
section: utils
priority: optional
homepage: https://github.com/joel-sgc/netpala
description: >
  Lightweight terminal NetworkManager wrapper (Impala Go Edition).
  A TUI for managing WiFi connections via NetworkManager over DBus.
  Compatible with both wpa_supplicant and iwd backends. Supports
  WPA-PSK, WPA-SAE, WPA-Enterprise, open networks, VPN connections,
  and device enable/disable.

runtime_depends:
  - network-manager

produces:
  - netpala

distros:
  - debian13
  - ubuntu2404
  - ubuntu2604
