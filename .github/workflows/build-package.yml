# Triggered on versions.yml changes (detects which packages changed) or manually.
name: Build package

on:
  push:
    branches:
      - main
    paths:
      - 'versions.yml'

  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build (must exist in versions.yml). Leave empty when using distro.'
        required: false
        type: string
      distro:
        description: 'Build ALL packages for a specific distro (e.g. ubuntu2604). Leave empty when using package.'
        required: false
        type: choice
        options:
          - ''
          - debian13
          - ubuntu2404
          - ubuntu2604
      channel:
        description: 'Publishing channel (stable or dev)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - stable

jobs:
  detect:
    name: Detect package
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install yq
        run: bash scripts/install-yq.sh

      - name: Resolve packages and versions
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.distro }}" ]]; then
              bash scripts/detect-changes.sh --mode distro --distro "${{ inputs.distro }}"
            else
              bash scripts/detect-changes.sh --mode dispatch --package "${{ inputs.package }}"
            fi
          else
            bash scripts/detect-changes.sh --mode push
          fi

  build:
    name: Build ${{ matrix.package }} / ${{ matrix.distro }} / ${{ matrix.arch }}
    needs: detect
    if: needs.detect.outputs.builds != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yq
        run: bash scripts/install-yq.sh

      # Computed here (not just inside build.sh/passthrough.sh) so we can skip
      # QEMU/Buildx setup entirely for arch/package combos that won't build.
      - name: Check arch and package type
        id: check
        run: |
          PKG="${{ matrix.package }}"
          PKG_ARCH=$(yq e '.arch // ""' "packages/${PKG}/package.yml")
          PKG_TYPE=$(yq e '.type // "build"' "packages/${PKG}/package.yml")
          echo "pkg_type=${PKG_TYPE}" >> "$GITHUB_OUTPUT"
          if [[ "$PKG_ARCH" == "all" && "${{ matrix.arch }}" == "arm64" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$PKG_ARCH" && "$PKG_ARCH" != "all" && "$PKG_ARCH" != "${{ matrix.arch }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QEMU (arm64)
        if: matrix.arch == 'arm64' && steps.check.outputs.skip != 'true' && steps.check.outputs.pkg_type != 'passthrough'
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.pkg_type != 'passthrough'
        uses: docker/setup-buildx-action@v4

      - name: Build package
        if: steps.check.outputs.skip != 'true'
        run: |
          PKG="${{ matrix.package }}"
          if [[ "${{ steps.check.outputs.pkg_type }}" == "passthrough" ]]; then
            bash scripts/passthrough.sh "${PKG}" \
              --distro "${{ matrix.distro }}" \
              --arch   "${{ matrix.arch }}" \
              --output-dir output
          else
            # GH_TOKEN only needed here: build.sh downloads depends_on .deb releases via `gh`.
            GH_TOKEN="${{ secrets.APT_PKG_DISPATCH_TOKEN }}" bash scripts/build.sh "${PKG}" \
              --distro "${{ matrix.distro }}" \
              --arch   "${{ matrix.arch }}" \
              --output-dir output
          fi

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: output/*.deb
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Create GitHub Release — ${{ matrix.package_entry.package }}
    needs: [detect, build]
    if: needs.detect.outputs.builds != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        package_entry: ${{ fromJson(needs.detect.outputs.builds) }}

    steps:
      - name: Download artifacts for this package
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: ${{ matrix.package_entry.package }}-*
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.package_entry.package }}-${{ matrix.package_entry.version }}
          name: "${{ matrix.package_entry.package }} v${{ matrix.package_entry.version }}"
          files: artifacts/*.deb
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-apt-update:
    name: Trigger apt-packages (batch)
    needs: [detect, release]
    if: needs.detect.outputs.builds != '[]'
    runs-on: ubuntu-latest

    steps:
      - name: Build batch payload and dispatch
        env:
          GH_TOKEN: ${{ secrets.APT_PKG_DISPATCH_TOKEN }}
        run: |
          # workflow_dispatch: all packages use inputs.channel.
          # push: per-package channel from versions.yml; stable → registered to both stable and dev.
          CHANNEL="${{ inputs.channel }}"
          EVENT="${{ github.event_name }}"
          PAYLOAD=$(echo '${{ needs.detect.outputs.builds }}' | jq -c \
            --arg global_channel "$CHANNEL" \
            --arg event "$EVENT" \
            '[.[] | {
              package: .package,
              version: .version,
              suites: ( .matrix.include | map(.suite) | unique | join(" ") ),
              produces: .produces,
              channel: (if $event == "workflow_dispatch" then $global_channel else (.channel // "dev") end)
            } | if $event != "workflow_dispatch" and .channel == "stable" then ., (. + {channel: "dev"}) else . end]')

          BODY=$(jq -cn --argjson packages "$PAYLOAD" '{
            event_type: "packages-updated",
            client_payload: { packages: $packages }
          }')

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/omakasui/apt-packages/dispatches \
            --input - <<< "$BODY"